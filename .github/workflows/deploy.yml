name: Deploy site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Screenshot cache key
        id: shots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # screenshot settings + last push of every repo whose site is captured: a change in either retakes the pictures
          sites=$(jq -r 'to_entries[] | select(.value.hidden != true) | select(.value | tostring | test("\"screenshot")) | .key' data/overrides.json)
          cfg=$(jq -S 'map_values(del(.case, .case_es, .description, .description_es, .title, .category, .filters))' data/overrides.json)
          pushed=$(for n in $sites; do gh api "repos/${{ github.repository_owner }}/$n" --jq .pushed_at; done)
          echo "key=shots-${{ hashFiles('scripts/fetch-projects.sh', 'scripts/screenshot.mjs') }}-$(echo "$cfg$pushed" | sha1sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: data/img
          key: ${{ steps.shots.outputs.key }}
      - name: Fetch portfolio repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-projects.sh
      - name: Stage site
        run: |
          mkdir _site
          cp -r index.html privacy.html app.js privacy.js i18n.js data .well-known _site/
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
